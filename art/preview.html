<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Market Empire — три интерьера</title><style>*{box-sizing:border-box}body{margin:0;background:#171a1e;color:#e9edf1;font:16px system-ui}header{padding:18px 24px;border-bottom:1px solid #39434d}h1{font-size:24px;margin:0 0 8px}p{color:#b8c0c8;margin:8px 0}nav{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}button,a{font:inherit;color:#e9edf1}button{padding:12px 16px;background:#303a43;border:1px solid #4b5660;border-radius:8px;cursor:pointer}button.active{background:#e1e8ef;color:#17202a}main{padding:16px 24px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.item{border:1px solid #39434d;border-radius:10px;overflow:hidden;background:#21262c}.item img{width:100%;display:block;cursor:zoom-in}.details{padding:14px}.details strong{font-size:18px}.swatches{display:flex;gap:6px;margin:12px 0}.swatches span{width:32px;height:26px;border-radius:4px;border:1px solid #777}.large{display:none}.large img{max-width:100%;max-height:78vh;display:block;margin:auto;object-fit:contain}model-viewer{width:100%;height:77vh;background:#24272c}a{color:#cbdcf1}@media(max-width:850px){.grid{grid-template-columns:1fr}main{padding:12px}}</style><script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script></head><body><header><h1>Market Empire · Выбор интерьера</h1><p>Один магазин, три цветовые гаммы. Нажмите на изображение для увеличения.</p><nav><button id="all" class="active" onclick="compare()">Сравнить все</button><button onclick="show('modern')">1. Современный</button><button onclick="show('warm')">2. Уютный</button><button onclick="show('premium')">3. Премиальный</button><button onclick="view3d()">3D-обзор</button><a href="../">Игра</a></nav></header><main><div class="grid" id="grid"></div><div class="large" id="large"><h2 id="name"></h2><img id="picture"><model-viewer id="model" style="display:none" camera-controls camera-orbit="0deg 28deg 18m" field-of-view="35deg" shadow-intensity="1" exposure="1"></model-viewer><p><a id="glb">GLB</a> · <a id="blend">Blender</a></p></div></main><script>const styles={modern:['1. Светлый современный','Серый керамогранит, светлые стены, графитовые акценты.',['#b2b8be','#e2e5e7','#555d65','#b18b66']],warm:['2. Тёплый уютный','Песочный пол, молочные стены и тёплое дерево.',['#c4b39b','#e5d7c2','#6b6058','#bc8965']],premium:['3. Премиальный тёмный','Графитовая плитка, серые стены и контрастное дерево.',['#606970','#a0a7ae','#343b43','#ac8052']]};let current='modern';const grid=document.getElementById('grid'),large=document.getElementById('large'),picture=document.getElementById('picture'),model=document.getElementById('model');for(const [id,v] of Object.entries(styles)){const el=document.createElement('section');el.className='item';el.innerHTML='<img src="'+id+'/preview.png" alt="'+v[0]+'"><div class="details"><strong>'+v[0]+'</strong><p>'+v[1]+'</p><div class="swatches">'+v[2].map(c=>'<span style="background:'+c+'"></span>').join('')+'</div><button>Увеличить</button></div>';el.querySelector('img').onclick=el.querySelector('button').onclick=()=>show(id);grid.append(el)}function compare(){grid.style.display='grid';large.style.display='none'}function show(id){current=id;grid.style.display='none';large.style.display='block';picture.style.display='block';model.style.display='none';picture.src=id+'/preview.png';document.getElementById('name').textContent=styles[id][0];document.getElementById('glb').href=id+'/store_small_shop.glb';document.getElementById('blend').href=id+'/store_small_shop.blend'}function view3d(){show(current);picture.style.display='none';model.style.display='block';model.src=current+'/store_small_shop.glb'}</script></body></html>
