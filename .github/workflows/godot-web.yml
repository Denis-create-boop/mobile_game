name: Build and publish Market Empire
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: market-empire-pages
  cancel-in-progress: false
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.3 and templates
        run: |
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install /tmp/godot/Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          curl -fL --retry 3 -o /tmp/templates.tpz https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          cp -r /tmp/godot-templates/templates/. ~/.local/share/godot/export_templates/4.3.stable/
      - name: Download game assets
        run: python3 scripts/install_assets.py
      - name: Import and check scripts
        run: |
          set -o pipefail
          godot --headless --path . --editor --import --quit 2>&1 | tee /tmp/import.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' /tmp/import.log; then exit 1; fi
      - name: Smoke test main scene
        run: |
          set -o pipefail
          godot --headless --path . --quit-after 120 2>&1 | tee /tmp/smoke.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' /tmp/smoke.log; then exit 1; fi
      - name: Export Web
        run: |
          release="build/web/release-${GITHUB_SHA:0:12}"
          mkdir -p "$release"
          godot --headless --path . --export-release Web "$release/index.html"
          test -s "$release/index.html"
          test -s "$release/index.wasm"
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=release-%s/"><a href="release-%s/">Open Market Empire</a>' "${GITHUB_SHA:0:12}" "${GITHUB_SHA:0:12}" > build/web/index.html
      - name: Capture browser screenshots
        run: |
          pip install playwright pillow
          python -m playwright install --with-deps chromium
          python -m http.server 8765 --directory build/web > /tmp/server.log 2>&1 &
          python scripts/web_visual_check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: /tmp/menu.png
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-game-screenshot
          path: /tmp/game.png
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: market-empire-web
          path: build/web/
      - name: Build Blender art prototype
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-numpy
          blender -b --python-exit-code 1 --python-expr 'import numpy; print(numpy.__version__)'
          release="build/web/release-${GITHUB_SHA:0:12}"
          mkdir -p "$release/art"
          blender -b -t 4 --python-exit-code 1 --python scripts/blender_store.py -- "$release/art"
          cp art/preview.html "$release/art/index.html"
          for style in modern warm premium; do
            test -s "$release/art/$style/preview.png"
            test -s "$release/art/$style/store_small_shop.glb"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blender-art-preview
          path: build/web/release-*/art/
          if-no-files-found: warn
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare Pages artifact
        run: touch build/web/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
  deploy:
    needs: web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
